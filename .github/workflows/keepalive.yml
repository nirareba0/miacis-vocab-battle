name: Supabase Keepalive Ping

on:
  schedule:
    # 毎日 UTC 21:00（JST 6:00）に実行
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract config and ping Supabase
        run: |
          SUPABASE_URL=$(grep "SUPABASE_URL" web/js/config.js | sed -E "s/.*['\"](https:\/\/[^'\"]+)['\"].*/\1/")
          ANON_KEY=$(grep "SUPABASE_ANON_KEY" web/js/config.js | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/")

          if [ -z "$ANON_KEY" ] || [ "$ANON_KEY" = "__ANON_KEY__" ]; then
            echo "::notice ::SUPABASE_ANON_KEY is a placeholder (__ANON_KEY__). Skipping ping."
            exit 0
          fi

          echo "Pinging ${SUPABASE_URL}/rest/v1/rpc/ping..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${SUPABASE_URL}/rest/v1/rpc/ping" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            -H "Content-Type: application/json" || true)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Supabase ping successful (HTTP 200): $BODY"
          else
            echo "::warning ::Supabase ping failed with status ${HTTP_CODE}: ${BODY}"
          fi
